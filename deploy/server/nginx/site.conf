server {
    listen 80;
    server_name lame.su;
    return 301 https://$host$request_uri;
}

server {
    listent 443 ssl http2;
    server_name lame.su;

    ssl_certificate /etc/letsencrypt/live/lame.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lame.su/privkey.pem;

    root /var/www/lame.su;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}
